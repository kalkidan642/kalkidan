<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Quiz App</title>
    <link rel="stylesheet" href="Quiz.css">

</head>
<body>

<div class="container">

    <!-- Start Screen -->
    <div id="start-screen" class="screen active">

        <h1>Quiz Challenge</h1>

        <p>
            Test your JavaScript knowledge.
        </p>

        <button id="start-btn">
            Start Quiz
        </button>

    </div>


    <!-- Quiz Screen -->

    <div id="quiz-screen" class="screen">

        <div class="top-bar">

            <div class="progress">
                <div id="progress-bar"></div>
            </div>

            <div class="timer">
                Time:
                <span id="time">
                    15
                </span>
            </div>

        </div>


        <div class="question-number">
            Question
            <span id="current-question">
                1
            </span>

            /
            <span id="total-question">
                10
            </span>

        </div>


        <h2 id="question">
            Question appears here
        </h2>


        <div id="answers" class="answers">

        </div>


        <div class="navigation">

            <button id="next-btn">

                Next

            </button>

        </div>

    </div>


    <!-- Result Screen -->

    <div id="result-screen" class="screen">

        <h1>

            Quiz Completed

        </h1>


        <div class="score-circle">

            <span id="score">
                0
            </span>

            /

            <span id="max-score">
                10
            </span>

        </div>


        <h2 id="message">

            Excellent!

        </h2>


        <button id="restart-btn">

            Restart Quiz

        </button>

    </div>

</div>


<script src="Quiz.js"></script>

</body>
</html>
